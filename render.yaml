services:
  - type: web
    name: pixel-hunt
    runtime: node
    plan: free
    buildCommand: npm install --omit=optional
    healthCheckPath: /healthz
    startCommand: npm start
    envVars:
      - key: MONGODB_SRV
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOPUP_CONTACT
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
