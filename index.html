<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Hunt</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1c2c;--p:#29366f;--l:#3b5dc9;--g:#38b764;--y:#ffcd75;--r:#b13e53;--t:#f4f4f4;--d:#566c86}
*{box-sizing:border-box;image-rendering:pixelated}
body{margin:0;background:var(--bg);color:var(--t);font:10px/1.8 'Press Start 2P',monospace;padding:12px;max-width:760px;margin:auto}
.box{background:var(--p);padding:12px;margin:12px 0;box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,inset 0 -4px 0 0 #1d2b53}
h1{font-size:16px;color:var(--y);text-shadow:3px 3px #000;margin:0}
button{font:inherit;color:#fff;background:var(--l);border:0;padding:8px 10px;margin:3px;cursor:pointer;box-shadow:0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000,inset 0 -3px 0 #1d2b53}
button:active{transform:translateY(3px)}button:disabled{background:var(--d);cursor:not-allowed}
.g{background:var(--g)}.y{background:var(--y);color:#000}.r{background:var(--r)}
input{font:inherit;font-family:'Press Start 2P','Khmer OS',sans-serif;width:190px;padding:6px;background:#0c0e1a;color:var(--y);border:3px solid #000}
.bar{height:14px;background:#000;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
canvas{width:32px;height:32px}.sp{flex:1}
#log{min-height:70px;color:var(--y)}.tab.on{background:var(--y);color:#000}
.common{color:#ccc}.uncommon{color:#7bd}.rare{color:#6f6}.epic{color:#c8f}.legendary{color:var(--y)}.penalty{color:var(--r)}
#scene{width:100%;height:auto;display:block;margin-bottom:8px;box-shadow:0 0 0 3px #000}select{font:inherit;font-size:9px;background:#0c0e1a;color:var(--y);border:3px solid #000;padding:6px;max-width:100%}.chips{display:flex;flex-wrap:wrap;gap:2px;width:100%}.chips button{font-size:8px;padding:7px 8px}.chips button.on{background:var(--y);color:#000}.chips .nr{background:var(--r)}.chips .nb{background:#1a1c2c}.chips .ng{background:var(--g)}.scroll{max-height:170px;overflow-y:auto;padding:4px;background:#1d2b53}.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--p);padding:10px;margin:12px 0;position:sticky;top:6px;z-index:9;box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,inset 0 -4px 0 0 #1d2b53}
#av{width:52px;height:52px;background:#1d2b53;box-shadow:0 0 0 3px #000}.hl{flex:1;min-width:140px}.lvb{background:var(--y);color:#000;padding:2px 5px;margin-left:4px}
.hr{text-align:right;margin-left:auto}.mon{display:flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--y);font-size:13px}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{background:var(--y);color:#000}}
.seg{display:flex;gap:2px;margin:6px 0}.seg i{flex:1;max-width:18px;height:10px;background:#000}.seg i.f{background:var(--g)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--y);color:#000;padding:10px 14px;z-index:99;display:none;box-shadow:0 0 0 3px #000}
.hw{text-align:center;margin:8px 0 4px}.big{font-size:20px;padding:18px 48px;min-width:260px;max-width:100%;animation:pulse 1.2s steps(2) infinite}.big:disabled{animation:none}
@keyframes pulse{50%{transform:translateY(-3px)}}.cd{height:10px;background:#000;margin:12px auto 0;max-width:260px}.cd i{display:block;height:100%;background:var(--y);width:0}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}.tabs{display:flex;flex-wrap:wrap;margin-left:auto}.tabs button{font-size:9px}
.nav{position:relative;z-index:60}
@media (min-width:1040px){.nav{position:fixed;top:14px;left:calc(50% + 392px);flex-direction:column;align-items:stretch;flex-wrap:nowrap}
.nav .row{flex-direction:column;align-items:stretch;gap:0;margin:0}.tabs{flex-direction:column;flex-wrap:nowrap;margin:12px 0 0}
.nav button{display:block;width:150px;text-align:left;margin:5px 0;font-size:10px;padding:10px}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:80px 12px 12px;overflow:auto}#modal[hidden]{display:none}
.mbox{background:var(--p);padding:14px;width:100%;max-width:640px;box-shadow:0 -4px 0 #000,0 4px 0 #000,-4px 0 0 #000,4px 0 0 #000,inset 0 -4px 0 #1d2b53}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--y)}
#log hr{border:0;border-top:3px dashed #1d2b53;margin:8px 0}#log .old{opacity:.5}
.eq{display:flex;flex-wrap:wrap;gap:2px 14px}.eq>b{width:100%;color:var(--y)}.slot{display:flex;gap:8px;align-items:center;flex:1 1 150px;margin:6px 0}
.slot canvas{width:40px;height:40px;background:#1d2b53;box-shadow:0 0 0 3px #000}.slot.empty canvas{opacity:.35}.slot small{color:#8aa0bd}.slot b{font-size:9px;word-break:break-word}
.shopc{display:flex;gap:12px;align-items:center}.shopc>canvas{flex:none;background:#1d2b53;box-shadow:0 0 0 3px #000}
@media (min-width:1100px){.eq{position:fixed;top:14px;right:calc(50% + 392px);width:170px;margin:0;flex-direction:column;flex-wrap:nowrap;z-index:20}.slot{flex:none}}
#bcv{width:100%;height:auto;display:block;margin:8px 0;box-shadow:0 0 0 3px #000}
#mbox{position:fixed;left:12px;bottom:12px;z-index:70;background:var(--p);padding:8px;width:240px;box-shadow:0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000}#mbox[hidden]{display:none}
#mbox .mh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}#mbox .mh b{font-size:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--y)}#mbox button{font-size:9px;padding:5px 7px}#ytwrap iframe{width:224px;height:126px;display:block}
#ann{margin:8px 0}#ann[hidden]{display:none}.annb{display:flex;gap:8px;align-items:center;background:var(--y);color:#000;padding:8px 10px;margin:4px 0;box-shadow:0 0 0 3px #000}.annb button{font-size:8px;padding:4px 6px}
.tab3{font-size:9px}
#cz{width:100%;height:auto;display:block;margin-bottom:8px;box-shadow:0 0 0 3px #000}.tab3.on{background:var(--y);color:#000}#login{text-align:center;padding:30px 0}a{color:var(--y)}
</style></head><body>
<h1>⛏ PIXEL HUNT</h1>
<div id="login" class="box" hidden><div class="row" style="justify-content:center"><button class="y" id="tlog">🔑 LOGIN</button><button id="treg">📝 REGISTER</button></div>
 <div id="flog"><p>Welcome back! Log in with your name and password.</p><div class="row" style="justify-content:center"><input id="nm" maxlength="20" placeholder="your name" autofocus autocomplete="username"><input id="pw" type="password" placeholder="password" autocomplete="current-password"><button class="g" id="go">PLAY</button></div><p><small>New here? Press REGISTER to create your name first.</small></p></div>
 <div id="freg" hidden><p>Create your hunter name. You will use it to log in.</p><div class="row" style="justify-content:center"><input id="rnm" maxlength="20" placeholder="choose a name" autocomplete="off"><input id="rpw" type="password" placeholder="password (4+)" autocomplete="new-password"><input id="rpw2" type="password" placeholder="repeat password" autocomplete="new-password"><button class="g" id="rgo">REGISTER</button></div></div>
 <p id="le" class="penalty"></p><p id="lok" class="rare"></p></div>
<div id="app" hidden>
 <div class="hud"><canvas id="av" width="16" height="16"></canvas>
 <div class="hl"><div><b id="who"></b><span class="lvb">LV <b id="lv"></b></span></div><div class="bar"><i id="xpb"></i></div><small id="xp"></small></div>
 <div class="hr"><div class="mon"><canvas id="coin"></canvas><b id="bal"></b></div><small>BANK <b id="bank"></b></small>
  <div style="margin-top:6px"><button class="y" id="daily">DAILY</button> <a href="/logout"><small>exit</small></a></div></div></div>
<div id="toast"></div>
<div class="box eq" id="eq"></div>
<div class="nav"><div class="row"><button class="g" id="nh">⛏ HUNT</button><button class="r" id="nc">🎰 CASINO</button><button id="nq">📜 QUESTS</button></div>
 <div class="tabs"><button class="tab" data-t="inv">🎒 BAG</button><button class="tab" data-t="gbag">🧰 GEAR</button><button class="tab" data-t="shop">🛒 SHOP</button><button class="tab" data-t="bank">🏦 BANK</button><button class="tab" data-t="pvp">⚔ PVP</button><button class="tab" data-t="top">🏆 TOP</button><button class="tab" data-t="auto">🤖 AUTO</button><button class="tab" data-t="music">🎵 MUSIC</button><button class="tab" data-t="topup">💎 TOP UP</button></div></div>
<div id="vh"><div class="box"><canvas id="scene" width="160" height="72"></canvas><div class="hw"><button class="g big" id="hunt">⛏ HUNT!</button><div class="cd"><i id="cdb"></i></div></div></div>
 <div class="box"><b>📜 HUNT LOG</b><div id="log">Ready to hunt!</div></div></div>
<div id="vc" hidden><div class="box"><canvas id="cz" width="160" height="90"></canvas>
 <div><button class="tab3 on" data-g="slots">SLOTS</button><button class="tab3" data-g="coin">COINFLIP</button><button class="tab3" data-g="rou">ROULETTE</button><button class="tab3" data-g="door">4 DOORS</button><button class="tab3" data-g="gem">LUCKY GEM</button><button class="tab3" data-g="bj">🃏 BLACKJACK</button><button class="tab3" data-g="kk">🎲 KLA KLOUK</button><button class="tab3" data-g="hr">🐎 HORSES</button><button class="tab3" data-g="pok">🂠 POK</button><button class="tab3" data-g="gtn">🔢 GUESS</button></div>
 <div class="row"><input id="bet" placeholder="bet"><button id="all" class="y">ALL IN</button></div>
 <div class="row" id="opts"></div><button class="g" id="play">SPIN</button></div>
 <div class="box" id="clog">Welcome to the casino! Pick a game, place your bet.</div></div>
<div id="vq" hidden><div class="box"><b>📜 DAILY QUESTS</b> <small>reset at midnight</small><div id="qlist"></div><button class="g" id="qclaim">CLAIM</button></div></div>
</div>
<div id="modal" hidden><div class="mbox"><div class="mh"><b id="mt"></b><button class="r" id="mx">✕</button></div><div id="mres" style="color:var(--y);margin-bottom:8px"></div><div id="panel"></div></div></div>
<script>
var FT=null;
const $=i=>document.getElementById(i),n=x=>Number(x).toLocaleString();
// emoji -> tiny canvas -> upscaled with pixelated rendering = instant pixel-art sprites
function spr(e,s=14){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.font=(s-2)+'px serif';x.textBaseline='middle';x.textAlign='center';x.fillText(e,s/2,s/2+1);
 const d=x.getImageData(0,0,s,s);for(let i=3;i<d.data.length;i+=4)d.data[i]=d.data[i]>110?255:0;x.putImageData(d,0,0);return c}
$('coin').replaceWith(Object.assign(spr('🪙'),{id:'coin'}));
let me,tab='inv',busy=0;
// ---- pixel hunting scene (160x72 canvas, scaled up) ----
const cv=$('scene'),cx=cv.getContext('2d'),W=160,H=72,fl=(c,x,y,w,h)=>{const g=FT||cx;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
cx.imageSmoothingEnabled=false;
const RC={legendary:'#ffcd75',epic:'#c8f',rare:'#6f6',uncommon:'#7bd',common:'#ccc',penalty:'#b13e53',nothing:'#888'};
const sc={mode:'idle',t:0,off:0,sps:[],col:'#fff',bad:0,
 go(){this.mode='walk';this.t=0;this.sps=[]},
 end(r){if(r.error){this.mode='idle';return}this.mode='dig';this.t=0;this.sps=r.found.map(f=>spr(f.emoji));this.col=RC[(r.found[0]||{}).rarity]||'#fff';this.bad=r.pay<0||!r.found.length}};

// ---- armored knight, drawn from rectangles (idle / walk / sword slash / victory) ----
function ln(c,x0,y0,x1,y1){const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));for(let i=0;i<=n;i++)fl(c,x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,1,1)}
function knight(x,y,m,t){
 const wk=m==='walk'?Math.floor(t/5)%2:0;y+=m==='walk'?wk:(m==='idle'||m==='show'?Math.floor(t/30)%2:0);
 const sl=m==='dig',p=(t%21)/21,a=sl?-2.4+p*2.8:m==='walk'?-1.1:m==='show'?-1.57:-2.1,hx=x+5,hy=y+17,tx=hx+Math.cos(a)*14,ty=hy+Math.sin(a)*14;
 const sword=()=>{ln('#566c86',hx+1,hy+1,tx+1,ty+1);ln('#94b0c2',hx+1,hy,tx+1,ty);ln('#f4f4f4',hx,hy,tx,ty);fl('#ffcd75',hx-1,hy-1,3,3);
  if(sl)for(let k=1;k<8;k++){const b=a-k*.13;fl('#73eff7',hx+Math.cos(b)*17,hy+Math.sin(b)*17,2,2)}};
 const l1=m==='walk'?(wk?2:-1):0,l2=m==='walk'?(wk?-1:2):0;
 fl('#1a1c2c',x+5+l1,y+23,4,5);fl('#566c86',x+6+l1,y+23,2,4);fl('#1a1c2c',x+10+l2,y+23,4,5);fl('#566c86',x+11+l2,y+23,2,4);
 fl('#1a1c2c',x+4,y+18,10,6);fl('#29366f',x+5,y+18,8,5);fl('#3b5dc9',x+5,y+22,8,1);
 fl('#1a1c2c',x+3,y+9,12,10);fl('#94b0c2',x+5,y+10,8,8);fl('#c0cbdc',x+6,y+10,2,4);fl('#566c86',x+5,y+16,8,1);
 fl('#566c86',x+3,y+9,3,3);fl('#566c86',x+12,y+9,3,3);fl('#c0cbdc',x+3,y+9,2,1);
 fl('#1a1c2c',x+5,y,8,10);fl('#94b0c2',x+6,y+1,6,8);fl('#c0cbdc',x+7,y+1,3,2);fl('#1a1c2c',x+9,y+4,4,1);fl('#566c86',x+6,y+7,6,2);
 if(!sl)sword();
 fl('#1a1c2c',x+11,y+10,8,12);fl('#ef7d57',x+12,y+11,6,10);fl('#41a6f6',x+13,y+12,4,8);fl('#73eff7',x+14,y+13,1,3);fl('#ffcd75',x+12,y+11,6,1);
 if(sl)sword()}
function frame(){const s=sc;s.t++;if(s.mode==='walk')s.off+=1.3;
 cx.save();cx.translate(s.mode==='show'&&s.bad&&s.t<14?(s.t%2?1:-1):0,0);
 fl('#3b5dc9',0,0,W,30);fl('#41a6f6',0,30,W,24);
 for(let x=0;x<W;x++){const h=7+Math.sin((x+s.off*.3)/11)*3;fl('#257179',x,52-h,1,h)}
 fl('#38b764',0,52,W,H-52);fl('#257179',0,56,W,2);
 for(let i=0;i<5;i++){const x=((i*37-s.off)%(W+30)+W+30)%(W+30)-15;fl('#73463a',x+3,40,3,12);fl('#1d6b3a',x-1,28,11,13);fl('#38b764',x+1,28,5,3)}
  knight(30,26,s.mode,s.t);
 if(s.mode==='dig'){if(s.t%21>12)for(let k=0;k<4;k++)fl('#ffcd75',50+k*3,50-((s.t*2+k*5)%12),2,2);if(s.t>42){s.mode='show';s.t=0}}
 if(s.mode==='show'&&s.sps.length){const n=s.sps.length,z=n>2?14:28,bn=Math.abs(Math.sin(s.t/7))*Math.max(0,14-s.t/6);
  s.sps.forEach((sp,i)=>cx.drawImage(sp,n>2?75+(i%5)*16:90+i*34,(n>2?16+(i/5|0)*17:14)-bn,z,z));
  for(let k=0;k<10;k++){const a=s.t/15+k*.63,r=26+Math.sin(s.t/6+k)*4;fl(s.col,(n>2?107:105)+Math.cos(a)*r,28+Math.sin(a)*r*.7,2,2)}
  if(s.t<5){cx.globalAlpha=.6;fl(s.bad?'#b13e53':'#fff',0,0,W,H);cx.globalAlpha=1}}
 cx.restore();requestAnimationFrame(frame)}
frame();

async function api(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
 if(r.status===401){$('login').hidden=false;$('app').hidden=true;throw 0}return r.json()}
let hl=[];const say=h=>{hl=[h,...hl].slice(0,6);$('log').innerHTML=hl.map((x,i)=>`<div class="${i?'old':''}">${x}</div>`).join('<hr>')};
async function load(){me=await api('/api/me');$('login').hidden=true;$('app').hidden=false;
 $('who').textContent=me.name;dEnd=Date.now()+me.dailyLeft;hEnd=Date.now()+me.huntLeft;setDaily();setHunt();renderEq();$('bal').textContent=n(me.balance);$('bank').textContent=n(me.bank);$('lv').textContent=me.level;
 $('xp').textContent=`${n(me.xp)}/${n(me.need)} XP`;$('xpb').style.width=Math.min(100,me.xp/me.need*100)+'%';render()}
async function act(u,b,f,w){if(busy)return;busy=1;try{const[r]=await Promise.all([api(u,b),new Promise(z=>setTimeout(z,w||0))]);
 if(w){sc.end(r);await new Promise(z=>setTimeout(z,700))}
 const html=r.error?`<span class=penalty>${r.error}</span>`:f?f(r):r.msg;if(u==='/api/hunt'){if(!r.error)say(html)}else $('mres').innerHTML=html;{const tm=r.error||r.msg;if(tm)toast(tm)}await load()}catch(e){sc.mode='idle'}busy=0}
$('daily').onclick=async()=>{try{const r=await api('/api/daily',{});toast(r.error||r.msg);load()}catch(e){}};
const fmt=r=>(r.found.length?r.found.map(f=>`<div class=${f.rarity}>${f.emoji} ${f.name} (${f.rarity}) ${f.value>=0?'+':''}${n(f.value)}<br><small>${f.message}</small></div>`).join(''):'The wilderness was quiet...')
 +`<div>TOTAL ${r.pay>=0?'+':''}${n(r.pay)} coins, +${r.gain} XP${r.shovel?' · '+r.shovel:''}</div>`+(r.levelUp?`<div class=legendary>★ LEVEL UP! You are level ${r.levelUp} ★</div>`:'');
$('hunt').onclick=()=>{if(!busy){sc.go();act('/api/hunt',{},fmt,1200)}};
const TT={inv:'🎒 BAG',pvp:'⚔ PVP',gbag:'🧰 GEAR BAG',shop:'🛒 SHOP',bank:'🏦 BANK',top:'🏆 TOP',auto:'🤖 AUTO HUNT'},M=$('modal');
const closeM=()=>{M.hidden=true;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'))};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(!M.hidden&&tab===b.dataset.t)return closeM();tab=b.dataset.t;M.hidden=false;$('mt').textContent=TT[tab];$('mres').innerHTML='';
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
$('mx').onclick=closeM;M.addEventListener('click',e=>{if(e.target===M)closeM()});
async function render(){if($('modal').hidden)return;const p=$('panel');p.innerHTML='';
 if(tab==='inv'){if(!me.inventory.length){p.textContent='Empty. Go hunt!';return}
  const m={};me.inventory.forEach(i=>(m[i.name]??={...i,c:0}).c++);
  const sell=document.createElement('div');sell.innerHTML='<button class="y" id="sa">SELL ALL</button>';p.append(sell);$('sa').onclick=()=>act('/api/sell',{});
  Object.values(m).sort((a,b)=>b.value-a.value).forEach(i=>{const r=document.createElement('div');r.className='row';r.append(spr(i.emoji));
   r.insertAdjacentHTML('beforeend',`<span class="sp ${i.rarity}">${i.c}x ${i.name} <small>(${n(i.value)})</small></span>`);
   const b=document.createElement('button');b.textContent='SELL';b.onclick=()=>act('/api/sell',{name:i.name,qty:'all'});r.append(b);p.append(r)})}
 if(tab==='bank'){p.innerHTML=`<div class=legendary>WALLET ${n(me.balance)}</div><div>BANK ${n(me.bank)}</div><br><div class=row><input id=amt placeholder=amount><button class=y id=amax>ALL</button></div><div class=row><button class=g id=dep>DEPOSIT</button><button id=wd>WITHDRAW</button></div>`;
  $('amax').onclick=()=>$('amt').value='all';
  const go=a=>{const v=$('amt').value.trim();if(!v)return toast('Type an amount first (or press ALL).');act('/api/bank',{action:a,amount:v})};
  $('dep').onclick=()=>go('deposit');$('wd').onclick=()=>go('withdraw')}
 if(tab==='auto'){const a=await api('/api/autohunt');A={...a,at:Date.now()};const S=a.skills,
  inf={worker:['Worker','+'+(S.worker-1)*15+'% bonus animal chance'],workerXP:['Worker XP','+'+(S.workerXP-1)*5+'% XP'],strategy:['Strategy','better loot quality'],radar:['Radar','fewer failed hunts'],duration:['Duration','max hunt '+S.duration*30+' min']};

  const bb=document.createElement('button');bb.textContent='⚔ BATTLE';bb.onclick=()=>act('/api/battle/challenge',{targetId:u.id,bet:$('pbet').value}).then(pollB);r.append(rb,bb);el.append(r)})}
let BS=null,bAnim={who:-1,t:0},lastN=-1,lastSt='';const seenCh=new Set();
function bframe(){requestAnimationFrame(bframe);const c=$('bcv');if(!c||$('modal').hidden||tab!=='pvp')return;const g=c.getContext('2d');g.imageSmoothingEnabled=false;FT=g;bAnim.t++;
 fl('#3b5dc9',0,0,160,34);fl('#41a6f6',0,34,160,18);fl('#38b764',0,52,160,12);fl('#257179',0,56,160,2);
 const md=w=>bAnim.who===w&&bAnim.t<42?'dig':'idle';knight(20,24,md(0),bAnim.t);g.save();g.translate(160,0);g.scale(-1,1);knight(20,24,md(1),bAnim.t);g.restore();FT=null}
bframe();
async function pollB(){if(!me)return;let r;try{r=await api('/api/battle/state')}catch(e){return}BS=r;const m=r.match;
 (r.incoming||[]).forEach(c=>{if(!seenCh.has(c.id)){seenCh.add(c.id);toast(`⚔ ${c.from} challenged you for ${n(c.bet)} coins! Open PVP.`)}});
 if(m&&m.n!==lastN){lastN=m.n;bAnim={who:m.status==='active'?(m.turn==='you'?1:0):(m.winner==='you'?0:1),t:0}}
 if(m&&m.status==='done'&&lastSt!=='done'){load();toast(m.msg)}lastSt=m?m.status:'';drawB(r)}
setInterval(pollB,1500);
function drawB(r){const el=$('bst');if(!el||tab!=='pvp'||$('modal').hidden)return;el.innerHTML='';const m=r.match,add=h=>el.insertAdjacentHTML('beforeend',h);
 (r.incoming||[]).forEach(c=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<span class="sp legendary">⚔ ${esc(c.from)} challenges you for ${n(c.bet)} coins!</span>`;
  [['ACCEPT','g',true],['DECLINE','r',false]].forEach(([t,k,a])=>{const b=document.createElement('button');b.textContent=t;b.className=k;b.onclick=()=>act('/api/battle/respond',{id:c.id,accept:a}).then(pollB);d.append(b)});el.append(d)});
 if(!m){if(!(r.incoming||[]).length)add('<small>No battle right now. Challenge a player below.</small>');return}
 if(m.status==='pending'||!m.you){add(`<div>${m.status==='pending'?`⏳ Waiting for <b>${esc(m.opp.name)}</b> to accept (${n(m.bet)} coins)...`:esc(m.msg)}</div>`);return}
 const bar=(h,x,c)=>`<div class=bar><i style="width:${h/x*100}%;background:${c}"></i></div>`;
 add(`<div class=row><span class=sp><b>${esc(m.you.name)}</b> ❤ ${m.you.hp}/${m.you.max}<br><small>ATK ${m.you.atk} · DEF ${m.you.def}</small>${bar(m.you.hp,m.you.max,'#38b764')}</span><span class=sp><b>${esc(m.opp.name)}</b> ❤ ${m.opp.hp}/${m.opp.max}<br><small>ATK ${m.opp.atk} · DEF ${m.opp.def}</small>${bar(m.opp.hp,m.opp.max,'#b13e53')}</span></div>`);
 add(`<div class=legendary>${m.status==='done'?esc(m.msg):m.turn==='you'?'YOUR TURN!':'Waiting for '+esc(m.opp.name)+'...'}</div>`+m.log.slice(-6).map(x=>`<div><small>${esc(x)}</small></div>`).join(''));
 if(m.status==='active'){const row=document.createElement('div');row.className='row';
  const mk=(t,k,a,dis)=>{const b=document.createElement('button');b.textContent=t;b.className=k;b.disabled=dis;b.onclick=()=>act('/api/battle/act',{id:m.id,action:a},()=>'').then(pollB);row.append(b)};
  mk('⚔ ATTACK','g','attack',m.turn!=='you');if(m.you.skill)mk(`✨ ${m.you.skill.name}${m.you.skill.cd?' ('+m.you.skill.cd+')':''}`,'y','skill',m.turn!=='you'||m.you.skill.cd>0);mk('🏳 FORFEIT','r','forfeit',false);el.append(row)}}
const clog=h=>$('clog').innerHTML=h;
function setG(g){cg=g;ca.mode='idle';ca.r=null;ca.t=0;ca.p=[];document.querySelectorAll('.tab3').forEach(b=>b.classList.toggle('on',b.dataset.g===g));
 const o=$('opts');o.innerHTML='';o.style.display=g==='rou'?'block':'';$('play').textContent=g==='coin'?'FLIP':g==='door'||g==='gem'?'START':'SPIN';ca.pk=null;ca.hv=-1;
 if(g==='coin')['heads','tails'].forEach(x=>{const b=document.createElement('button');b.textContent=x.toUpperCase();b.className=x===side?'y':'';
  b.onclick=()=>{side=x;[...o.children].forEach(c=>c.className=c===b?'y':'')};o.append(b)});
 if(g==='door'||g==='gem')o.innerHTML='<small>Press START, then tap '+(g==='door'?'one of the 4 doors':'one of the 9 gems')+'.</small>';
 if(g==='rou'){o.innerHTML='<b>1. CHOOSE BET TYPE</b><div class="chips" id="rtypes"></div><b>2. YOUR BET</b><div id="rsel" style="margin:4px 0"></div><div class="chips scroll" id="rvals"></div>';loadRB()}}
let RB,rT='straight',rV=null;
const RT=[['straight','Single number 35:1'],['split','Split 17:1'],['street','Street 11:1'],['corner','Corner 8:1'],['five','Five 0-00-1-2-3 6:1'],['line','Line 5:1'],['dozen','Dozen 2:1'],['column','Column 2:1'],['low','1-18 1:1'],['high','19-36 1:1'],['red','Red 1:1'],['black','Black 1:1'],['odd','Odd 1:1'],['even','Even 1:1']];
async function loadRB(){try{RB=RB||await api('/api/roulette/bets')}catch(e){return}
 $('rtypes').innerHTML='';RT.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.onclick=()=>{rT=k;rV=null;drawR()};$('rtypes').append(b)});drawR()}
function drawR(){[...$('rtypes').children].forEach(b=>b.classList.toggle('on',b.dataset.k===rT));
 const L=RB[rT].list;if(L.length===1)rV=L[0].v;const v=$('rvals');v.innerHTML='';v.hidden=L.length===1;
 L.forEach(x=>{const b=document.createElement('button');b.textContent=x.l;
  if(rT==='straight')b.className=x.l==='0'||x.l==='00'?'ng':RED.includes(String(x.l))?'nr':'nb';
  if(String(x.v)===String(rV))b.classList.add('on');b.onclick=()=>{rV=x.v;drawR()};v.append(b)});
 const c=L.find(x=>String(x.v)===String(rV));$('rsel').innerHTML=c?`<span class=legendary>${c.l}</span> · pays ${RB[rT].pay}:1`:'Tap your numbers below'}
document.querySelectorAll('.tab3').forEach(b=>b.onclick=()=>{if(!cbusy)setG(b.dataset.g)});
const V={vh:$('vh'),vc:$('vc'),vq:$('vq')},showV=k=>Object.entries(V).forEach(([i,e])=>e.hidden=i!==k);
$('nc').onclick=()=>{showV('vc');setG(cg)};$('nh').onclick=()=>showV('vh');$('nq').onclick=()=>{showV('vq');loadQ()};
$('all').onclick=()=>$('bet').value='all';
$('play').onclick=async()=>{if(cbusy)return;const bet=$('bet').value.trim();if(!bet)return clog('<span class=penalty>Type a bet first (or press ALL IN).</span>');
 if(cg==='rou'&&rV==null)return clog('<span class=penalty>Tap your numbers first.</span>');
 cbusy=1;$('play').disabled=true;const unlock=()=>{cbusy=0;$('play').disabled=false};ca.unlock=unlock;const pk=cg==='door'||cg==='gem';
 try{const r=pk?await api('/api/pick/start',{game:cg==='door'?'4door':'luckygem',bet}):await api('/api/'+{slots:'slots',coin:'coinflip',rou:'roulette'}[cg],{bet,side,type:rT,value:rV});
  if(r.error){clog(`<span class=penalty>${r.error}</span>`);return unlock()}
  if(pk){ca.mode='pick';ca.r=null;ca.t=0;ca.p=[];ca.pk=null;ca.cb=null;return clog(`Tap ${cg==='door'?'a door':'a gem'}!`)}
  clog('Good luck...');ca.r=r;ca.t=0;ca.mode='run';ca.p=[];
  ca.cb=async()=>{clog(`${r.grid?`<div style="font-size:16px;line-height:1.3">${r.grid.map(x=>x.join(' ')).join('<br>')}</div>`:''}<div class="${r.change>0?'rare':'penalty'}">${r.msg}</div><div>${r.change>=0?'+':''}${n(r.change)} coins</div>`);await load();unlock()}}
 catch(e){unlock()}};

const post=async(u,b)=>(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
const ltab=r=>{$('freg').hidden=!r;$('flog').hidden=r;$('treg').className=r?'y':'';$('tlog').className=r?'':'y';$('le').textContent='';$('lok').textContent='';(r?$('rnm'):$('nm')).focus()};
$('tlog').onclick=()=>ltab(false);$('treg').onclick=()=>ltab(true);
$('go').onclick=async()=>{$('lok').textContent='';const r=await post('/api/login',{name:$('nm').value,password:$('pw').value});
 if(r.error){$('le').textContent=r.error;if(/REGISTER first/.test(r.error)){$('rnm').value=$('nm').value}}else{$('pw').value='';load()}};
$('rgo').onclick=async()=>{$('le').textContent='';if($('rpw').value!==$('rpw2').value)return $('le').textContent='The two passwords do not match.';
 const r=await post('/api/register',{name:$('rnm').value,password:$('rpw').value,confirm:$('rpw2').value});
 if(r.error)return $('le').textContent=r.error;const nm=$('rnm').value;$('rpw').value=$('rpw2').value='';ltab(false);$('nm').value=nm;$('pw').focus();$('lok').textContent=r.msg};
['nm','pw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()}));
['rnm','rpw','rpw2'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('rgo').click()}));
load().catch(()=>{});
